<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Job Board Website</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f5f7fa;
    }

    /* Navbar */

    .navbar{
      width:100%;
      padding:20px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:transparent;
      position:absolute;
      top:0;
      left:0;
      z-index:100;
    }

    .logo{
      color:white;
      font-size:32px;
      font-weight:bold;
    }

    .logo span{
      color:#00ff66;
    }

    .nav-links{
      display:flex;
      gap:30px;
    }

    .nav-links a{
      text-decoration:none;
      color:white;
      font-size:17px;
      transition:0.3s;
    }

    .nav-links a:hover{
      color:#00ff66;
    }

    .nav-btn{
      display:flex;
      gap:15px;
      align-items:center;
    }

    .login{
      color:white;
      text-decoration:none;
      font-size:16px;
    }

    .post-btn{
      background:#00e65c;
      color:white;
      padding:12px 22px;
      border-radius:6px;
      text-decoration:none;
      font-weight:bold;
      transition:0.3s;
    }

    .post-btn:hover{
      background:#00cc52;
    }

    /* Hero Section */

    .hero{
      width:100%;
      min-height:100vh;
      background:linear-gradient(to right,#0066ff,#1da1ff);
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:120px 8%;
      overflow:hidden;
      position:relative;
    }

    .hero::before{
      content:"";
      position:absolute;
      left:-150px;
      bottom:-100px;
      width:450px;
      height:450px;
      background:rgba(255,255,255,0.05);
      border-radius:50%;
    }

    .hero-text{
      width:50%;
      color:white;
      z-index:2;
    }

    .hero-text h3{
      font-size:35px;
      margin-bottom:20px;
    }

    .hero-text h1{
      font-size:70px;
      margin-bottom:20px;
      line-height:1.2;
    }

    .hero-text p{
      font-size:18px;
      line-height:1.7;
      margin-bottom:35px;
      color:#e6f0ff;
    }

    .upload-btn{
      background:#00e65c;
      color:white;
      padding:15px 30px;
      text-decoration:none;
      border-radius:8px;
      font-size:18px;
      font-weight:bold;
      transition:0.3s;
    }

    .upload-btn:hover{
      background:#00cc52;
    }

    /* Hero Image */

    .hero-image{
      width:45%;
      display:flex;
      justify-content:center;
      z-index:2;
    }

    .image-box{
      width:100%;
      max-width:450px;
      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    .top-bar{
      height:12px;
      width:80%;
      background:#dbeafe;
      border-radius:10px;
      margin-bottom:25px;
    }

    .chart{
      display:flex;
      justify-content:space-around;
      align-items:flex-end;
      height:180px;
      margin-bottom:20px;
    }

    .bar{
      width:45px;
      background:#3399ff;
      border-radius:10px 10px 0 0;
    }

    .bar1{
      height:90px;
    }

    .bar2{
      height:140px;
    }

    .bar3{
      height:110px;
    }

    .bar4{
      height:160px;
    }

    .bottom-card{
      background:#0066ff;
      color:white;
      padding:18px;
      border-radius:12px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    /* Search Section */

    .search-box{
      width:85%;
      background:white;
      margin:-50px auto 0;
      padding:25px;
      border-radius:18px;
      box-shadow:0 8px 20px rgba(0,0,0,0.12);
      display:flex;
      gap:20px;
      position:relative;
      z-index:10;
    }

    .search-box input,
    .search-box select{
      flex:1;
      padding:16px;
      border:1px solid #ddd;
      border-radius:8px;
      font-size:16px;
      outline:none;
    }

    .find-btn{
      background:#00e65c;
      color:white;
      border:none;
      padding:16px 35px;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
    }

    .find-btn:hover{
      background:#00cc52;
    }

    /* Responsive */

    @media(max-width:900px){

      .hero{
        flex-direction:column;
        text-align:center;
        padding-top:150px;
      }

      .hero-text{
        width:100%;
        margin-bottom:50px;
      }

      .hero-text h1{
        font-size:50px;
      }

      .hero-image{
        width:100%;
      }

      .search-box{
        flex-direction:column;
      }

      .nav-links{
        display:none;
      }
    }

  </style>

</head>

<body>

  <!-- Navbar -->

  <div class="navbar">

    <div class="logo">
      <span>Q</span> Job Board
    </div>

    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Browse Jobs</a>
      <a href="#">Pages</a>
      <a href="#">Blog</a>
      <a href="#">Contact</a>
    </div>

    <div class="nav-btn">
      <a href="#" class="login">Log In</a>
      <a href="#" class="post-btn">Post A Job</a>
    </div>

  </div>

  <!-- Hero Section -->

  <section class="hero">

    <div class="hero-text">

      <h3>4536+ Jobs listed</h3>

      <h1>Find your <br> Dream Job</h1>

      <p>
        We provide online instant job opportunities with quick applications
        and secure hiring process for everyone.
      </p>

      <a href="#" class="upload-btn">
        Upload Your Resume
      </a>

    </div>

    <!-- Right Side -->

    <div class="hero-image">

      <div class="image-box">

        <div class="top-bar"></div>

        <div class="chart">

          <div class="bar bar1"></div>
          <div class="bar bar2"></div>
          <div class="bar bar3"></div>
          <div class="bar bar4"></div>

        </div>

        <div class="bottom-card">
          Job Analytics Dashboard
        </div>

      </div>

    </div>

  </section>

  <!-- Search Box -->

  <div class="search-box">

    <input type="text" placeholder="Search keyword">

    <input type="text" placeholder="Location">

    <select>
      <option>Category</option>
      <option>Developer</option>
      <option>Designer</option>
      <option>Marketing</option>
    </select>

    <button class="find-btn">
      Find Job
    </button>

  </div>

</body>
</html>
